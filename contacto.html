<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbolle — Contacto</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <a href="index.html" class="logo">Futbolle</a>
    <nav class="nav-principal">
      <a href="index.html" class="enlace-nav">Juego</a>
      <a href="contacto.html" class="enlace-nav">Contacto</a>
      <a id="enlace-github" class="enlace-nav" href="https://github.com/renzocampisi/final-daw-2026" target="_blank" rel="noopener">GitHub</a>
      <button id="boton-modo-oscuro" class="enlace-nav boton-tema" type="button" aria-label="Cambiar a modo oscuro">
        <svg id="icono-luna" class="icono-tema" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="luna-base" cx="12" cy="12" r="9"></circle>
          <circle class="luna-recorte" cx="17" cy="9" r="8"></circle>
        </svg>
        <svg id="icono-sol" class="icono-tema oculto" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle class="sol-centro" cx="12" cy="12" r="5"></circle>
          <line class="sol-rayo" x1="12" y1="1" x2="12" y2="4"></line>
          <line class="sol-rayo" x1="12" y1="20" x2="12" y2="23"></line>
          <line class="sol-rayo" x1="1" y1="12" x2="4" y2="12"></line>
          <line class="sol-rayo" x1="20" y1="12" x2="23" y2="12"></line>
          <line class="sol-rayo" x1="4.2" y1="4.2" x2="6.3" y2="6.3"></line>
          <line class="sol-rayo" x1="17.7" y1="17.7" x2="19.8" y2="19.8"></line>
          <line class="sol-rayo" x1="4.2" y1="19.8" x2="6.3" y2="17.7"></line>
          <line class="sol-rayo" x1="17.7" y1="6.3" x2="19.8" y2="4.2"></line>
        </svg>
      </button>
    </nav>
  </header>
  <main class="contenido-principal">
    <section class="pantalla-contacto">
      <h1 class="titulo-juego">Contacto</h1>
      <p class="texto-intro">¿Encontraste un error o querés dejar un comentario? Escribinos.</p>
      <form id="formulario-contacto" class="formulario-contacto" novalidate>
        <label for="input-nombre-contacto" class="etiqueta">Nombre</label>
        <input id="input-nombre-contacto" class="campo-texto" type="text" maxlength="40" autocomplete="off">
        <p id="error-nombre-contacto" class="mensaje-error oculto">Ingresá un nombre válido, solo letras y números.</p>
        <label for="input-mail-contacto" class="etiqueta">Mail</label>
        <input id="input-mail-contacto" class="campo-texto" type="text" maxlength="60" autocomplete="off">
        <p id="error-mail-contacto" class="mensaje-error oculto">Ingresá un mail válido.</p>
        <label for="input-mensaje-contacto" class="etiqueta">Mensaje</label>
        <textarea id="input-mensaje-contacto" class="campo-texto campo-mensaje" maxlength="500"></textarea>
        <p id="error-mensaje-contacto" class="mensaje-error oculto">El mensaje debe tener más de 5 caracteres.</p>
        <button id="boton-enviar-contacto" class="boton-primario" type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <script src="js/tema.js"></script>
  <script src="js/contacto.js"></script>
</body>
</html>
